openapi: 3.0.3
info:
  title: IssueTrack API
  version: 1.0.0
  description: |
    Jira-style issue tracker API (Node + Express + TypeScript + MongoDB).

    Authentication: an httpOnly cookie (`it_token`) is set by `/auth/login` and
    `/auth/register`. Non-browser clients may send the same JWT as
    `Authorization: Bearer <token>`.

    Every response uses `{ success, data, meta? }`; errors use
    `{ success: false, error: { message, code, details? } }`.
servers:
  - url: http://localhost:4000/api
    description: Local development
  - url: https://issuetrack-api.onrender.com/api
    description: Production example
tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Members
  - name: Issues
  - name: Comments
  - name: Attachments
  - name: Activity
  - name: Dashboard

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Dashboard]
      security: []
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: must contain a letter and a digit }
                avatarUrl: { type: string, format: uri, nullable: true }
      responses:
        '201': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the auth cookie
      responses:
        '200': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /users/me:
    get:
      tags: [Users]
      summary: Profile of the signed-in user
      responses:
        '200': { description: OK }
    patch:
      tags: [Users]
      summary: Update name/avatar or change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                avatarUrl: { type: string, format: uri, nullable: true }
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Updated user }
        '400': { $ref: '#/components/responses/ValidationError' }
  /users/lookup:
    get:
      tags: [Users]
      summary: Find a registered user by exact email
      parameters:
        - { in: query, name: email, required: true, schema: { type: string, format: email } }
      responses:
        '200': { description: '{ user } — user is null when unknown' }
  /users/search:
    get:
      tags: [Users]
      summary: Search users by name/email
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, minLength: 2 } }
      responses:
        '200': { description: '{ users: User[] }' }
  /projects:
    get:
      tags: [Projects]
      summary: Projects the caller belongs to
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [Projects]
      summary: Create a project (caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, key]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9]{1,9}$', example: WEB }
                description: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Created project }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Project detail (members included)
      responses:
        '200': { description: Project }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Projects]
      summary: Rename / edit description (admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Updated project }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Projects]
      summary: Delete the project (owner only)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
  /projects/{projectId}/stats:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Aggregate counters for the project
      responses:
        '200': { description: Stats }
  /projects/{projectId}/labels:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Distinct labels used in the project
      responses:
        '200': { description: Label list }
  /projects/{projectId}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Activity]
      summary: Project audit log
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 30, maximum: 100 } }
      responses:
        '200': { description: Activity entries (newest first) }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: Owner + members with roles
      responses:
        '200': { description: '{ owner, members, canManage }' }
    post:
      tags: [Members]
      summary: Add a registered user by email (admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '201': { description: Member added }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - { in: path, name: userId, required: true, schema: { type: string } }
    patch:
      tags: [Members]
      summary: Change a member's role (admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '200': { description: Updated project }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Members]
      summary: Remove a member (admin+, or self-removal)
      responses:
        '200': { description: Updated project }
        '403': { $ref: '#/components/responses/Error' }
  /projects/{projectId}/issues:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Issues]
      summary: Paginated/filterable issue list
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/Priorities'
        - $ref: '#/components/parameters/Types'
        - { in: query, name: assignee, schema: { type: string, description: 'user id, "me" or "unassigned"' } }
        - { in: query, name: reporter, schema: { type: string, description: 'user id or "me"' } }
        - { in: query, name: label, schema: { type: string } }
        - { in: query, name: dueDateFrom, schema: { type: string, format: date } }
        - { in: query, name: dueDateTo, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Sort' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      issues:
                        type: array
                        items: { $ref: '#/components/schemas/Issue' }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      tags: [Issues]
      summary: Create an issue (member+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInput' }
      responses:
        '201': { description: Created issue }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Error' }
  /projects/{projectId}/issues/board:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Issues]
      summary: Kanban data — all issues of the project
      responses:
        '200': { description: '{ columns: { todo, "in-progress", done } }' }
  /issues:
    get:
      tags: [Issues]
      summary: Cross-project issue explorer
      parameters:
        - $ref: '#/components/parameters/Search'
        - { in: query, name: project, schema: { type: string } }
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/Priorities'
        - $ref: '#/components/parameters/Types'
        - { in: query, name: assignee, schema: { type: string } }
        - { in: query, name: reporter, schema: { type: string } }
        - { in: query, name: label, schema: { type: string } }
        - { $ref: '#/components/parameters/Sort' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Paginated issues }
  /issues/{issueId}:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Issues]
      summary: Issue detail
      responses:
        '200': { description: Issue }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Issues]
      summary: Update an issue (reporter/assignee/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInput' }
      responses:
        '200': { description: Updated issue }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Issues]
      summary: Delete an issue (reporter or admin/owner)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/status:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    patch:
      tags: [Issues]
      summary: Change status (Kanban drag & drop)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/IssueStatus' }
      responses:
        '200': { description: Updated issue }
        '403': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/assignee:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    patch:
      tags: [Issues]
      summary: Assign or unassign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: string, nullable: true, description: user id or null }
      responses:
        '200': { description: Updated issue }
        '400': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/comments:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Comments]
      summary: List comments (oldest first)
      responses:
        '200': { description: Comment list }
    post:
      tags: [Comments]
      summary: Add a comment (member+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { description: Created comment }
        '403': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/IssueId'
      - { in: path, name: commentId, required: true, schema: { type: string } }
    patch:
      tags: [Comments]
      summary: Edit your own comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200': { description: Updated comment }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Comments]
      summary: Delete your own comment (admins may delete any)
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/attachments:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    post:
      tags: [Attachments]
      summary: Upload screenshots/documents (member+, multipart field "files")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        '201': { description: Updated issue with attachments }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/IssueId'
      - { in: path, name: attachmentId, required: true, schema: { type: string } }
    get:
      tags: [Attachments]
      summary: Download an attachment using a short-lived signed token
      security: []
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        '200': { description: File stream }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Attachments]
      summary: Remove an attachment
      responses:
        '200': { description: Updated issue }
        '403': { $ref: '#/components/responses/Error' }
  /issues/{issueId}/activity:
    parameters:
      - $ref: '#/components/parameters/IssueId'
    get:
      tags: [Activity]
      summary: Issue audit trail
      responses:
        '200': { description: Activity entries (newest first) }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregated dashboard payload
      responses:
        '200': { description: '{ projects, stats, myIssues, recentActivity }' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: it_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    IssueId:
      in: path
      name: issueId
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    Search:
      in: query
      name: search
      schema: { type: string, maxLength: 200 }
    Statuses:
      in: query
      name: status
      schema: { type: string, description: 'CSV or repeated: todo,in-progress,done' }
    Priorities:
      in: query
      name: priority
      schema: { type: string, description: 'CSV or repeated: low,medium,high,critical' }
    Types:
      in: query
      name: type
      schema: { type: string, description: 'CSV or repeated: bug,task,story' }
    Sort:
      in: query
      name: sort
      schema:
        type: string
        enum: [newest, oldest, priority, dueDate, recentlyUpdated]
        default: newest
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    ErrorBody:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: string, example: FORBIDDEN }
            details:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    ProjectRole:
      type: string
      enum: [owner, admin, member, viewer]
    IssueStatus:
      type: string
      enum: [todo, in-progress, done]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: string, nullable: true }
    Member:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            role: { $ref: '#/components/schemas/ProjectRole' }
            addedAt: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        key: { type: string, example: WEB }
        description: { type: string }
        owner: { $ref: '#/components/schemas/User' }
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
        memberCount: { type: integer }
        role: { $ref: '#/components/schemas/ProjectRole' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Attachment:
      type: object
      properties:
        id: { type: string }
        originalName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        url: { type: string, description: includes a 15-minute signed token }
        uploadedBy: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
    IssueInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        type: { type: string, enum: [bug, task, story] }
        priority: { type: string, enum: [low, medium, high, critical] }
        status: { $ref: '#/components/schemas/IssueStatus' }
        assignee: { type: string, nullable: true }
        labels:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 30 }
        dueDate: { type: string, nullable: true, description: ISO date or date-time }
    Issue:
      allOf:
        - $ref: '#/components/schemas/IssueInput'
        - type: object
          properties:
            id: { type: string }
            projectId: { type: string }
            projectKey: { type: string }
            issueNumber: { type: integer }
            issueKey: { type: string, example: WEB-12 }
            reporter: { $ref: '#/components/schemas/User' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
            commentCount: { type: integer }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPrevPage: { type: boolean }
  responses:
    AuthSuccess:
      description: Authenticated user plus session cookie
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string, description: only for non-browser clients }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
